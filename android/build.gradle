// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0-beta04'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.42"
        classpath "com.vanniktech:gradle-dependency-graph-generator-plugin:0.6.0"
        classpath 'com.google.gms:google-services:4.3.10' // this has nothing to do with Google Play Services
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'
    }
}

apply plugin: "com.vanniktech.dependency.graph.generator"


allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

