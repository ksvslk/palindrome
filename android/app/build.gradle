plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.20'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-parcelize'
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', 'HEAD'
        standardOutput = stdout
    }
    return "\"" + stdout.toString().trim().subSequence(0, 8) + "\""
}


android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.indest.hah"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 5 // versionCode does not necessarily have a strong resemblance to versionName
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }


    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "GIT_HASH", getGitHash()
            ndk {
                debugSymbolLevel = 'full'
            }
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        debug {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "GIT_HASH", getGitHash()
            ndk {
                debugSymbolLevel = 'full'
            }
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        benchmark {
            buildConfigField "String", "GIT_HASH", getGitHash()
            signingConfig signingConfigs.debug
            matchingFallbacks = ['instantRelease']
            proguardFiles("benchmark-rules.pro.txt")
            debuggable false
        }
    }

    flavorDimensions "default"

    productFlavors {
        instant {
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        regular {
            versionCode = defaultConfig.versionCode + 1000
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn'
        ]
    }


    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/licenses/**']
        }
        resources {
            excludes += ['**/attach_hotspot_windows.dll', 'META-INF/licenses/**', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
    buildToolsVersion '33.0.0'
    namespace 'com.indest.hah'
    androidResources {
        noCompress 'wav'
    }

}

kapt {
    correctErrorTypes true
}

configurations.all {
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}

