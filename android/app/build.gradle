plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.7.0'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', 'HEAD'
        standardOutput = stdout
    }
    return "\"" + stdout.toString().trim().subSequence(0, 8) + "\""
}

android {
    compileSdkVersion 32

    defaultConfig {
        applicationId "com.indest.hah"
        minSdkVersion 21
        targetSdkVersion 32
        versionCode 5 // versionCode does not necessarily have a strong resemblance to versionName
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "GIT_HASH", getGitHash()
            ndk {
                debugSymbolLevel = 'full'
            }
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        debug {
            minifyEnabled false
            buildConfigField "String", "GIT_HASH", getGitHash()
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        benchmark {
            buildConfigField "String", "GIT_HASH", getGitHash()
            signingConfig signingConfigs.debug
            matchingFallbacks = ['instantRelease']
            debuggable false
        }
    }

    flavorDimensions "default"

    productFlavors {
        instant {
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        regular {
            versionCode = defaultConfig.versionCode + 1000
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn'
        ]
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/licenses/**']
        }
        resources {
            excludes += ['**/attach_hotspot_windows.dll', 'META-INF/licenses/**', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
    buildToolsVersion '33.0.0'

}

kapt {
    correctErrorTypes true
}

